<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/love-judge-demo/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A little room for understanding. Love Judge early prototype.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Love Judge">
  

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>Love Judge</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    window.loveJudgeNativeShare = async function(title, text, url) {
      if (!navigator.share) return 'unsupported';
      try { await navigator.share({title, text, url}); return 'shared'; }
      catch (error) { return error.name === 'AbortError' ? 'cancelled' : 'failed'; }
    };
    window.loveJudgeOpenShare = function(url) {
      const win = window.open(url, '_blank');
      if (win) win.opener = null;
      return Boolean(win);
    };
    window.loveJudgeDownloadReport = function (html, filename) {
      const url = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
      const anchor = document.createElement('a');
      anchor.href = url;
      anchor.download = filename;
      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
